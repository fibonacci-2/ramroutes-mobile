<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@600&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#f5ead8;overflow:hidden;font-family:'Figtree',sans-serif}
  @keyframes splashGlow{0%,100%{opacity:.45;transform:scale(.88)}50%{opacity:.8;transform:scale(1.1)}}
  @keyframes ringOut1{0%{opacity:.8;transform:scale(.5)}75%,100%{opacity:0;transform:scale(1.7)}}
  @keyframes ringOut2{0%{opacity:.6;transform:scale(.5)}75%,100%{opacity:0;transform:scale(1.7)}}
  @keyframes iconEnter{0%{transform:scale(.3) translateY(10px);opacity:0}55%{transform:scale(1.12) translateY(0);opacity:1}75%{transform:scale(.96)}100%{transform:scale(1)}}
  @keyframes dotSettle{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes textRise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes tagRise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="display:flex;flex-direction:column;align-items:center;gap:22px">
  <div style="position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;animation:iconEnter .85s cubic-bezier(.32,.72,.25,1) both">
    <div style="position:absolute;inset:0;border-radius:112px;background:#c67139"></div>
    <div style="position:absolute;inset:0;border-radius:112px;background:radial-gradient(circle, rgba(198,113,57,.9) 0%, rgba(198,113,57,.35) 60%, transparent 100%);animation:splashGlow 2.4s ease-in-out .85s infinite"></div>
    <div style="position:absolute;inset:22px;border-radius:999px;border:5px solid rgba(255,255,255,.5);animation:ringOut1 2.4s ease-out .85s infinite"></div>
    <div style="position:absolute;inset:22px;border-radius:999px;border:5px solid rgba(255,255,255,.5);animation:ringOut2 2.4s ease-out 1.85s infinite"></div>
    <div style="position:relative;width:96px;height:96px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(46,43,37,.28)">
      <div style="width:36px;height:36px;border-radius:999px;background:#c67139;animation:dotSettle .6s cubic-bezier(.34,1.56,.64,1) .55s both"></div>
    </div>
  </div>
  <div style="font-family:'Caprasimo',sans-serif;font-size:34px;color:#402310;animation:textRise .5s ease-out .75s both">Appa</div>
  <div style="font-size:13px;font-weight:600;color:#82796a;letter-spacing:.02em;animation:tagRise .5s ease-out .95s both">Finding what's happening on campus</div>
</div>

</x-dc>
</body>
</html>
