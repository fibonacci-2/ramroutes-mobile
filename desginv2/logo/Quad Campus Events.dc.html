      const size = clusterSize(count), inner = Math.round(size * 0.46);
      return `<div style="position:relative;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;inset:0;border-radius:999px;background:radial-gradient(circle, color-mix(in srgb, var(--color-accent) 85%, transparent) 0%, color-mix(in srgb, var(--color-accent) 30%, transparent) 62%, transparent 100%);animation:pulseGlow 2.6s ease-in-out infinite"></div>
        <div style="position:absolute;inset:6px;border-radius:999px;border:1.5px solid color-mix(in srgb, var(--color-accent) 55%, transparent);animation:pulseRing 2.6s ease-in-out infinite"></div>
        <div style="position:relative;width:${inner}px;height:${inner}px;border-radius:999px;background:var(--color-accent);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff">
          <span style="font-family:var(--font-heading);font-size:${inner>34?17:14}px;color:#fff">${count}</span>
        </div>
      </div>`;
    }
    function computeClusters() {
      const evs = EVENTS.filter(e => mapCat==='all' || e.cat===mapCat);
      const pts = evs.map(e => ({ev:e, p: map.latLngToContainerPoint(e.ll)}));
      const R = 52;
      const used = new Array(pts.length).fill(false);
      const clusters = [];
      for (let i=0;i<pts.length;i++){
        if (used[i]) continue;
        const group=[pts[i]]; used[i]=true;
        for (let j=i+1;j<pts.length;j++){
          if (used[j]) continue;
          if (pts[i].p.distanceTo(pts[j].p) < R) { group.push(pts[j]); used[j]=true; }
        }
        clusters.push(group);
      }
      return clusters;
    }
    function drawPins() {
      Object.values(markers).forEach(m => map.removeLayer(m)); markers = {};
      computeClusters().forEach(group => {
        if (group.length > 1) {
          const center = group.reduce((a,g)=>[a[0]+g.ev.ll[0], a[1]+g.ev.ll[1]],[0,0]).map(x=>x/group.length);
          const size = clusterSize(group.length);
          const m = L.marker(center,{icon:L.divIcon({className:'',html:clusterHtml(group.length),iconSize:[size,size],iconAnchor:[size/2,size/2]})}).addTo(map);
          m.on('click', () => { const b = L.latLngBounds(group.map(g=>g.ev.ll)); map.flyToBounds(b,{padding:[46,46], maxZoom:18}); });
          group.forEach(g => markers[g.ev.id] = m);
        } else {
          const ev = group[0].ev;
          const m = L.marker(ev.ll,{icon:L.divIcon({className:'',html:pinHtml(ev, ev.id===selId),iconSize:[36,36],iconAnchor:[18,32]})}).addTo(map);
          m.on('click', () => selectEvent(ev.id, true));
          markers[ev.id] = m;
        }
      });
    }
    let redrawTmr;
    map.on('zoomend moveend', () => { clearTimeout(redrawTmr); redrawTmr = setTimeout(drawPins, 30); });
    function refreshPinStyles() { drawPins(); }

    const chipStyle = on => `flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid ${on?'var(--color-text)':'var(--color-divider)'};background:${on?'var(--color-text)':'white'};font-family:var(--font-body);font-weight:700;font-size:12.5px;color:${on?'var(--color-bg)':'var(--color-text)'};cursor:pointer;box-shadow:var(--shadow-sm)`;
    const chipRow = (el, cur, cb) => {
      el.innerHTML = `<button data-c="all" style="${chipStyle(cur==='all')}" data-hbg="var(--color-accent-100)">All</button>` +
        Object.entries(CATS).map(([k,c]) => `<button data-c="${k}" style="${chipStyle(cur===k)}" data-hbg="var(--color-accent-100)">${icon(c.ic,13)} ${c.label}</button>`).join('');
      el.onclick = e => { const b = e.target.closest('button[data-c]'); if (b) cb(b.dataset.c); };
    };
    function setMapCat(c) { mapCat = c; selId = null; chipRow($('qc-mapchips'), c, setMapCat); drawPins(); renderRail(); }

    const rail = $('qc-cardrail');
    function railCard(ev) {
      const c = CATS[ev.cat];
      return `<div data-id="${ev.id}" style="flex:none;width:300px;background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid ${ev.id===selId?'var(--color-accent)':'transparent'}">
        <div style="flex:none;width:54px;height:54px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:${c.tint};color:${c.ink}">${icon(c.ic,24)}</div>
        <div style="min-width:0"><h5 style="margin:0 0 2px;font-size:15px;line-height:1.15">${ev.t}</h5><div style="font-size:11.5px;font-weight:600;color:var(--color-neutral-600);line-height:1.35">${ev.day} ${ev.date} · ${ev.time.split(' – ')[0]}<br>${ev.v} · ${dist(ev.ll)} mi</div></div>
      </div>`;
    }
    function renderRail() {
      const evs = EVENTS.filter(e => mapCat==='all' || e.cat===mapCat);
      rail.innerHTML = evs.map(railCard).join('');
      rail.querySelectorAll('[data-id]').forEach(c => c.onclick = () => { if (c.dataset.id===selId) openDetail(c.dataset.id); else selectEvent(c.dataset.id, false); });
    }
    let railTmr;
    rail.addEventListener('scroll', () => {
      clearTimeout(railTmr);
      railTmr = setTimeout(() => {
        const cards = [...rail.querySelectorAll('[data-id]')]; if (!cards.length) return;
        const mid = rail.scrollLeft + rail.clientWidth/2; let best = cards[0], bd = 1e9;
        cards.forEach(c => { const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - mid); if (d < bd) { bd = d; best = c; } });
        if (best.dataset.id !== selId) { selId = best.dataset.id; refreshPinStyles(); renderRail(); map.panTo(byId(selId).ll, {animate:true}); }
      }, 120);
    });
    function selectEvent(id, fromPin) {
      selId = id; refreshPinStyles(); renderRail();
      const card = rail.querySelector(`[data-id="${id}"]`);
      if (card) rail.scrollTo({left: card.offsetLeft - (rail.clientWidth - card.offsetWidth)/2, behavior:'smooth'});
      map.flyTo(byId(id).ll, Math.max(map.getZoom(), 17), {animate:true});
      if (fromPin === undefined) openDetail(id);
    }
    $('qc-locbtn').onclick = () => { selId = null; refreshPinStyles(); map.flyTo([42.2769,-83.7375], 15); };
    $('qc-mapsearch').onclick = () => setTab('list');
    setMapCat('all');

    // ---- list ----
    $('qc-q').oninput = e => { query = e.target.value.toLowerCase(); renderList(); };
    const segStyle = on => `flex:1;border:none;border-radius:999px;padding:8px 0;font-family:var(--font-body);font-weight:700;font-size:12.5px;color:${on?'var(--color-text)':'var(--color-neutral-700)'};background:${on?'white':'none'};box-shadow:${on?'var(--shadow-sm)':'none'};cursor:pointer`;
    const dayseg = $('qc-dayseg');
    function renderDayseg() {
      dayseg.innerHTML = [['all','All'],['today','Today'],['weekend','Weekend']].map(([d,l]) => `<button data-d="${d}" style="${segStyle(dayF===d)}">${l}</button>`).join('');
    }

    dayseg.onclick = e => { const b = e.target.closest('button[data-d]'); if (!b) return; dayF = b.dataset.d; renderDayseg(); renderList(); };
    function setListCat(c) { listCat = c; chipRow($('qc-listchips'), c, setListCat); renderList(); }
    const DAYORDER=[['Thu Sep 17','Today'],['Fri Sep 18','Tomorrow'],['Sat Sep 19',''],['Sun Sep 20',''],['Mon Sep 21',''],['Tue Sep 22','']];
    const FULLDAY={Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday',Mon:'Monday',Tue:'Tuesday'};
    function rowHtml(ev) {
      const c = CATS[ev.cat];
      return `<div data-id="${ev.id}" style="display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer">
        <div style="width:46px;height:46px;border-radius:17px;background:${c.tint};color:${c.ink};display:flex;align-items:center;justify-content:center">${icon(c.ic,21)}</div>
        <div style="min-width:0"><h5 style="margin:0 0 2px;font-size:15px">${ev.t}</h5><div style="font-size:11.5px;font-weight:600;color:var(--color-neutral-600);line-height:1.35">${ev.time.split(' – ')[0]} · ${ev.v} · ${dist(ev.ll)} mi</div></div>

    }
    function filtered() {
      return EVENTS.filter(e => (listCat==='all'||e.cat===listCat)
        && (dayF==='all'||(dayF==='today'&&e.day==='Thu')||(dayF==='weekend'&&(e.day==='Sat'||e.day==='Sun')))
        && (!query||(e.t+' '+e.v+' '+CATS[e.cat].label).toLowerCase().includes(query))).sort((a,b)=>a.sort-b.sort);
    }
    function renderList() {
      const evs = filtered(); const el = $('qc-list');
      if (!evs.length) { el.innerHTML = `<div style="text-align:center;padding:70px 40px;color:var(--color-neutral-600)"><div style="width:96px;height:96px;border-radius:40% 60% 55% 45%/55% 45% 60% 40%;background:var(--color-surface);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:var(--color-accent-600)">${icon('search',34)}</div><h4>Nothing matches</h4><p style="font-size:13px">Try a different day or category.</p></div>`; return; }
      el.innerHTML = DAYORDER.map(([d,nick]) => {
        const dayEvs = evs.filter(e => `${e.day} ${e.date}`===d); if (!dayEvs.length) return '';
        return `<div style="font-family:var(--font-heading);font-size:16px;margin:16px 20px 8px;display:flex;align-items:baseline;gap:8px">${nick||FULLDAY[d.split(' ')[0]]} <small style="font-family:var(--font-body);font-weight:600;font-size:11px;color:var(--color-neutral-600)">${d.slice(4)}</small></div>` + dayEvs.map(rowHtml).join('');
      }).join('');

    }
    function bindRows(el) {
      el.querySelectorAll('[data-bk]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleSave(b.dataset.bk); });
      el.querySelectorAll('[data-id]').forEach(r => r.onclick = () => openDetail(r.dataset.id));
    }
    setListCat('all');

    // ---- saved ----
    function renderSaved() {
      const el = $('qc-savedlist'); const evs = EVENTS.filter(e => saved.has(e.id)).sort((a,b)=>a.sort-b.sort);
      el.innerHTML = evs.length ? evs.map(rowHtml).join('') : `<div style="text-align:center;padding:70px 40px;color:var(--color-neutral-600)"><div style="width:96px;height:96px;border-radius:40% 60% 55% 45%/55% 45% 60% 40%;background:var(--color-surface);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:var(--color-accent-600)">${icon('bookmark',34)}</div><h4>Nothing saved yet</h4><p style="font-size:13px">Tap the bookmark on any event and it lands here.</p><button id="qc-browse" style="flex:none;padding:13px 26px;border-radius:999px;border:none;background:var(--color-accent);color:white;font-family:var(--font-heading);font-size:15px;cursor:pointer">Browse events</button></div>`;
      bindRows(el);
      const browse = $('qc-browse'); if (browse) browse.onclick = () => setTab('list');
    }
    function toggleSave(id) {
      saved.has(id) ? saved.delete(id) : saved.add(id); persist();
      toast(saved.has(id) ? 'Saved to your list' : 'Removed from saved');
      root.querySelectorAll(`[data-bk="${id}"]`).forEach(b => { b.style.color = saved.has(id) ? 'var(--color-accent)' : 'var(--color-neutral-500)'; });
      if (tab === 'saved') renderSaved();
      const d = $('qc-detail'); if (d.style.visibility === 'visible' && d.dataset.id === id) renderDetail(id);
    }
    let toastTmr;
    function toast(msg) { const t = $('qc-toast'); t.textContent = msg; t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; clearTimeout(toastTmr); toastTmr = setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(12px)'; }, 1600); }

    // ---- detail ----
    function renderDetail(id) {
      const ev = byId(id), c = CATS[ev.cat], d = $('qc-detail'); d.dataset.id = id;
      const warm = ['career','clubs','shows'].includes(ev.cat);
      d.innerHTML = `<div style="flex:none;height:210px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:${c.tint}">
        <button id="qc-dback" style="position:absolute;top:60px;left:16px;width:40px;height:40px;border-radius:99px;background:white;border:none;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text);z-index:5" data-hbg="var(--color-accent-100)">${icon('back',20)}</button>
        <div style="width:150px;height:150px;border-radius:44% 56% 60% 40%/50% 42% 58% 50%;display:flex;align-items:center;justify-content:center;background:white;color:${c.ink}">${icon(c.ic,56)}</div></div>
        <div style="flex:1;overflow-y:auto;padding:20px 22px 120px;min-height:0">
        <span style="font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:${warm?'var(--color-accent-200)':'var(--color-accent-2-200)'};color:${warm?'var(--color-accent-800)':'var(--color-accent-2-800)'}">${CATS[ev.cat].label}</span>
        <h1 style="font-family:var(--font-heading);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 12px">${ev.t}</h1>
        <div style="display:flex;gap:12px;align-items:center;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--color-neutral-800)"><span style="flex:none;width:38px;height:38px;border-radius:14px;background:var(--color-surface);display:flex;align-items:center;justify-content:center;color:var(--color-accent-700)">${icon('clock',18)}</span><span>${ev.day}, ${ev.date}<small style="display:block;font-size:11px;color:var(--color-neutral-600);font-weight:600">${ev.time}</small></span></div>
        <div style="display:flex;gap:12px;align-items:center;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--color-neutral-800)"><span style="flex:none;width:38px;height:38px;border-radius:14px;background:var(--color-surface);display:flex;align-items:center;justify-content:center;color:var(--color-accent-700)">${icon('pin',18)}</span><span>${ev.v}<small style="display:block;font-size:11px;color:var(--color-neutral-600);font-weight:600">${dist(ev.ll)} mi from the Diag</small></span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px">${ev.tags.map(t=>`<span style="font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800)">${t}</span>`).join('')}</div>
        <p style="font-size:14px;line-height:1.6;margin-top:10px">${ev.desc}</p>
        <button id="qc-dask" style="width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 0;font-family:var(--font-heading);font-size:15px;border:none;cursor:pointer;background:white;color:var(--color-text);box-shadow:var(--shadow-sm)" data-hbg="var(--color-accent-100)">${icon('spark',16)} Ask Scout about this</button></div>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:14px 20px 34px;background:linear-gradient(transparent,var(--color-bg) 38%);display:flex;gap:10px">
        <button id="qc-ddir" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 0;font-family:var(--font-heading);font-size:15px;border:none;cursor:pointer;background:white;color:var(--color-text);box-shadow:var(--shadow-sm)" data-hbg="var(--color-accent-100)">${icon('nav',16)} Directions</button>
        <button id="qc-dsave" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 0;font-family:var(--font-heading);font-size:15px;border:none;cursor:pointer;background:var(--color-accent);color:white" data-hbg="var(--color-accent-600)">${icon('bookmark',16)} ${saved.has(id)?'Saved':'Save'}</button></div>`;
      $('qc-dback').onclick = closeDetail;
      $('qc-dsave').onclick = () => toggleSave(id);
      $('qc-ddir').onclick = () => { closeDetail(); setTab('map'); mapCat='all'; chipRow($('qc-mapchips'),'all',setMapCat); drawPins(); renderRail(); setTimeout(()=>{ map.invalidateSize(); selectEvent(id,true); map.flyTo(ev.ll,17); },80); };
      $('qc-dask').onclick = () => { closeDetail(); setTab('chat'); setTimeout(() => sendMsg(`Tell me about ${ev.t}`), 350); };
    }
    function openDetail(id) { renderDetail(id); const d=$('qc-detail'); d.style.transform='translateY(0)'; d.style.visibility='visible'; }
    function closeDetail() { const d=$('qc-detail'); d.style.transform='translateY(103%)'; d.style.visibility='hidden'; }

    // ---- chat ----
    const msgs = $('qc-msgs');
    let chatStarted = false;
    const QUICK=['What\u2019s on this weekend?','Anything career related?','Something fun tonight','Where can I volunteer?'];
    $('qc-qchips').innerHTML = QUICK.map(q => `<button style="flex:none;border:1.5px solid var(--color-accent-300);background:var(--color-accent-100);color:var(--color-accent-800);font-family:var(--font-body);font-weight:700;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer" data-hbg="var(--color-accent-200)">${q}</button>`).join('');
    $('qc-qchips').onclick = e => { const b = e.target.closest('button'); if (b) sendMsg(b.textContent); };
    function initChat() { if (chatStarted) return; chatStarted = true; aiSay('Hey! I\u2019m Scout \u2014 I know every event happening around campus this week. Ask me for recommendations, or tap a suggestion below.'); }
    function bubble(kind, html) {
      const el = document.createElement('div');
      el.style.cssText = kind==='ai'
        ? 'max-width:78%;padding:11px 15px;border-radius:22px;font-size:13.5px;font-weight:500;line-height:1.45;align-self:flex-start;background:white;border-bottom-left-radius:8px;box-shadow:var(--shadow-sm)'
        : 'max-width:78%;padding:11px 15px;border-radius:22px;font-size:13.5px;font-weight:500;line-height:1.45;align-self:flex-end;background:var(--color-accent);color:white;border-bottom-right-radius:8px';
      el.innerHTML = html; msgs.appendChild(el); msgs.scrollTop = msgs.scrollHeight; return el;
    }
    function evCard(ev) {
      const c = CATS[ev.cat]; const el = document.createElement('div');
      el.style.cssText = 'align-self:flex-start;width:82%;display:flex;gap:10px;align-items:center;background:white;border-radius:20px;padding:10px 12px;box-shadow:var(--shadow-sm);cursor:pointer;border:1.5px solid var(--color-divider)';
      el.innerHTML = `<div style="width:42px;height:42px;border-radius:15px;background:${c.tint};color:${c.ink};display:flex;align-items:center;justify-content:center">${icon(c.ic,19)}</div><div style="min-width:0"><h5 style="margin:0;font-size:13.5px">${ev.t}</h5><div style="font-size:11.5px;font-weight:600;color:var(--color-neutral-600)">${ev.day} ${ev.date} · ${ev.time.split(' – ')[0]} · ${dist(ev.ll)} mi</div></div>`;
      el.onclick = () => openDetail(ev.id); msgs.appendChild(el); msgs.scrollTop = msgs.scrollHeight;
    }
    function aiSay(text, ids=[]) {
      const tp = bubble('ai', '<span style="display:inline-flex;gap:4px;padding:4px 2px"><i style="width:6px;height:6px;border-radius:99px;background:var(--color-neutral-400);display:inline-block;animation:bnc 1s infinite"></i><i style="width:6px;height:6px;border-radius:99px;background:var(--color-neutral-400);display:inline-block;animation:bnc 1s infinite .15s"></i><i style="width:6px;height:6px;border-radius:99px;background:var(--color-neutral-400);display:inline-block;animation:bnc 1s infinite .3s"></i></span>');
      setTimeout(() => { tp.innerHTML = text; ids.forEach(id => evCard(byId(id))); msgs.scrollTop = msgs.scrollHeight; }, 700 + Math.random()*500);
    }
    function reply(q) {
      q = q.toLowerCase();
      const named = EVENTS.find(e => q.includes(e.t.toLowerCase()));
      if (named) return aiSay(`${named.t} is ${named.day} ${named.date} at ${named.time.split(' – ')[0]}, at ${named.v} — about ${dist(named.ll)} mi from you. ${named.desc.split('. ')[0]}. Want me to pull up anything similar?`, [named.id]);
      if (/career|job|intern|resume|network/.test(q)) return aiSay('Two good ones for that. The Career Expo on Friday is the big one — 120+ employers. If you want prep first, the Resume Clinic on Tuesday does 1:1 reviews.', ['expo','resume']);
      if (/weekend|saturday|sunday/.test(q)) return aiSay('The weekend is packed. My top picks: Jazz Ensemble Night on Saturday, the IM Soccer Finals in the afternoon, and the Arb River Cleanup on Sunday morning if you want fresh air.', ['jazz','soccer','arb']);
      if (/tonight|today/.test(q)) return aiSay('Tonight you\u2019ve got two: the Robotics Club Open House at 6 (free pizza), and the Improv Comedy Show at 9 — a fun back-to-back, they\u2019re 2 minutes apart.', ['robot','improv']);
      if (/volunteer|service|help out/.test(q)) return aiSay('Two options this week: the Arb River Cleanup on Sunday morning, or the Food Pantry Pack-a-thon on Monday — 45-minute walk-in shifts, so it fits between classes.', ['arb','pantry']);
      if (/music|show|concert|fun|dance|party/.test(q)) return aiSay('For a fun night: Salsa Club Social on Saturday (beginner lesson first hour), Jazz Ensemble Night at Hill, or the Improv Show tonight.', ['salsa','jazz','improv']);
      if (/sport|game|match|watch/.test(q)) return aiSay('Volleyball vs. Ohio State on Friday is the one to catch — rivalry game, students free. The IM Soccer Finals on Saturday are a good hang too.', ['vball','soccer']);
      if (/study|class|learn|workshop|python|tutor/.test(q)) return aiSay('The Python for Data Workshop on Monday is beginner-friendly and laptops are provided. There\u2019s also the Midterm Study Jam on Sunday with free coffee and tutors.', ['python','study']);
      if (/free|cheap|food/.test(q)) return aiSay('Most events this week are free. For free food specifically: Robotics Open House tonight has pizza, and the Study Jam on Sunday runs free coffee until midnight.', ['robot','study']);
      if (/saved|my list/.test(q)) { const s = [...saved]; return s.length ? aiSay(`You\u2019ve saved ${s.length} — here\u2019s what\u2019s coming up first.`, s.slice(0,3)) : aiSay('Your saved list is empty so far. Tell me what you\u2019re into — music, sports, career stuff — and I\u2019ll suggest some.'); }
      aiSay('I can recommend by vibe — try \u201csomething fun tonight\u201d, \u201ccareer events\u201d, or \u201cwhere can I volunteer?\u201d. Or tell me what you\u2019re into and I\u2019ll match you.');
    }
    function sendMsg(text) { if (!text.trim()) return; bubble('me', text); $('qc-chatin').value=''; setTimeout(() => reply(text), 200); }
    $('qc-sendbtn').onclick = () => sendMsg($('qc-chatin').value);
    $('qc-chatin').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(e.target.value); });

    // ---- init ----
    setTab('map');
    const fit = () => { const s = Math.min(1, (root.clientHeight-24)/852, (root.clientWidth-24)/393); $('qc-phone').style.transform = `scale(${s})`; };
    window.addEventListener('resize', fit); fit();
  }
}

</script>
</body>
</html>
